<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'none'; object-src 'none'">
<title>Case Closed AI — Starting</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Inter,Arial,sans-serif}
*{box-sizing:border-box}
body{height:100vh;margin:0;overflow:hidden;background:radial-gradient(ellipse 430px 260px at 50% 32%,#29272a,#14171c 62%,#0c0e12 95%);color:#f2ebe2;display:grid;place-items:center;user-select:none}
.container{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:1px solid #493a36}
.halo{position:absolute;width:300px;height:300px;top:26px;border:1px solid #96775a36;border-radius:50%;box-shadow:0 0 0 30px #d8ac7706,0 0 85px #ac35321c}
.halo:before{content:"";position:absolute;inset:-10px;border:1px dashed #c2a57d36;border-radius:50%;animation:orbit 14s linear infinite}
.mark{width:138px;height:138px;position:relative;z-index:2;opacity:0;transform:scale(.7) rotate(-15deg);filter:drop-shadow(0 18px 34px #0008);animation:reveal .85s .25s cubic-bezier(.14,.8,.3,1.17) forwards}
.light{position:absolute;z-index:3;width:115px;height:120px;left:calc(50% - 140px);top:calc(50% - 190px);background:linear-gradient(110deg,transparent 30%,#fff3cf44 50%,transparent 72%);transform:translateX(-160px) skewX(-15deg);animation:glint 1.25s 1.08s both;pointer-events:none}
.trace{position:absolute;top:calc(50% - 130px);left:calc(50% + 42px);width:145px;height:88px;z-index:1;opacity:.9}
.trace path{stroke:#bd4149;stroke-width:3;fill:none;stroke-dasharray:190;stroke-dashoffset:190;animation:thread 1.2s 1.1s ease-out forwards}
.name{z-index:3;margin:19px 0 4px;font-size:34px;letter-spacing:.18em;font-weight:750;opacity:0;transform:translateY(8px);animation:rise .65s 1.2s forwards}
.name span{color:#d6a774}
.slogan{z-index:3;font:11px Consolas,monospace;letter-spacing:.23em;color:#c0a992;opacity:0;animation:appear .65s 1.7s forwards}
.rule{width:236px;height:1px;background:linear-gradient(90deg,transparent,#ab4148,transparent);margin:22px 0 0;opacity:0;animation:appear .65s 1.85s forwards}
.loading{position:absolute;bottom:42px;text-align:center;width:65%;max-width:350px}
.loading p{color:#9f9895;font:11px Consolas,monospace;letter-spacing:.09em;margin:0 0 12px;animation:appear .5s 2s both}
.track{height:2px;background:#3e383a;overflow:hidden}
.track:before{content:"";display:block;width:100%;height:100%;background:linear-gradient(90deg,#784047,#d6a774);transform:scaleX(0);transform-origin:left;animation:loadline 2.9s .22s ease-out forwards}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes reveal{to{opacity:1;transform:scale(1) rotate(0deg)}}
@keyframes glint{from{transform:translateX(-160px) skewX(-15deg);opacity:0}55%{opacity:.55}to{transform:translateX(260px) skewX(-15deg);opacity:0}}
@keyframes thread{to{stroke-dashoffset:0}}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@keyframes appear{to{opacity:1}}
@keyframes loadline{to{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*,*:before{animation-duration:.01ms!important;animation-delay:0ms!important;animation-iteration-count:1!important}.mark,.name,.slogan,.rule,.loading p{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<div class="container">
<div class="halo" aria-hidden="true"></div>
<div class="light" aria-hidden="true"></div>
<svg class="trace" viewBox="0 0 145 88" aria-hidden="true"><path d="M5 8L53 8L98 50L140 50"/></svg>
<img class="mark" src="../assets/case-closed-mark.svg" alt="Case Closed AI folder and magnifying glass logo">
<div class="name">CASE CLOSED <span>AI</span></div>
<div class="slogan">DON'T GUESS. INVESTIGATE.</div>
<div class="rule" aria-hidden="true"></div>
<div class="loading"><p>PREPARING INVESTIGATION DESK</p><div class="track" aria-hidden="true"></div></div>
</div>
</body>
</html>
