name: Build Windows Review App
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['index.html', 'package.json', 'desktop/**', '.github/workflows/windows-review.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: CaseClosedAI-Windows-review-unsigned
          path: dist/*.exe
          if-no-files-found: error
