<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111418"><title>Case Closed AI — Investigation Desk</title>
<style>
:root{color-scheme:dark;font-family:Inter,Segoe UI,Arial,sans-serif;background:#111419;color:#f0eeee}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#252329 0,#111419 50%);min-height:100vh}button,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #d1a475;outline-offset:3px}.shell{display:grid;grid-template-columns:215px 1fr;min-height:100vh}.side{border-right:1px solid #302c2e;padding:26px 16px;background:#141619;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:12px;font-size:19px;font-weight:900;letter-spacing:.09em;line-height:1.08}.brand svg{width:47px;height:47px}.brand small{color:#d7a774}.motto{font:10px Consolas,monospace;color:#9e938c;letter-spacing:.13em;margin:20px 0 30px}.nav{display:grid;gap:7px}.nav button{background:none;border:1px solid transparent;text-align:left;padding:13px;border-radius:6px;color:#bcb5b5}.nav button.active,.nav button:hover{background:#282326;color:#f6e7d6;border-color:#483839}.privacy{margin-top:auto;font-size:12px;color:#99918c}.privacy b{color:#afc8b5}.main{max-width:1150px;width:100%;margin:0 auto;padding:38px clamp(20px,5vw,60px)}.micro{font:11px Consolas,monospace;color:#c29d76;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(30px,4vw,52px);letter-spacing:-.045em;margin:10px 0}h2{font-size:24px;letter-spacing:-.025em;margin:8px 0 18px}p{color:#bbb2ae;line-height:1.7}.hero{min-height:360px;position:relative;border:1px solid #49403d;background:linear-gradient(115deg,#272326 0%,#1b1c20 64%,#292021);border-radius:13px;padding:clamp(24px,5vw,55px);overflow:hidden}.hero:after{content:"";position:absolute;right:-130px;top:-160px;width:380px;height:380px;border:1px solid #51393b;border-radius:50%;box-shadow:0 0 0 70px #ffffff03,0 0 0 130px #ffffff02;pointer-events:none}.hero-copy{max-width:510px;position:relative;z-index:2}.hero .eyebrow{color:#c5a884}.hero p{font-size:16px}.btn{background:#b83239;color:white;border:1px solid #ce5258;border-radius:6px;padding:13px 20px;font-weight:700;transition:transform .22s,background .22s}.btn:hover{transform:translateY(-2px);background:#cc454c}.btn.secondary{background:#26272b;color:#e9d7c4;border-color:#514749}.btn.secondary:hover{background:#3a3133}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.folder-art{position:absolute;right:6%;top:26%;width:180px;height:130px;transform:rotate(-8deg);filter:drop-shadow(0 18px 14px #0008)}.folder-art .tab{position:absolute;background:#bd9468;width:76px;height:20px;top:-12px;left:4px;border-radius:5px 5px 0 0}.folder-art .body{position:absolute;inset:0;background:linear-gradient(135deg,#e0b582,#a57448);border-radius:7px;box-shadow:inset 0 0 0 2px #ffe3b44d}.folder-art .stamp{position:absolute;border:3px solid #772b2f;color:#772b2f;transform:rotate(-11deg);font:900 17px Consolas;left:19px;top:53px;padding:5px}.section-head{margin:29px 0 14px;font-size:15px;letter-spacing:.02em}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{border:1px solid #393337;background:#1c1e21;border-radius:8px;padding:18px;min-height:128px}.card h3{font-size:16px;margin:7px 0}.card p{font-size:13px;margin:0}.tag{font:11px Consolas,monospace;color:#c9a780}.status{border:1px solid #514144;border-radius:6px;color:#dfb4a4;font:11px Consolas;padding:5px 8px}.status.done{color:#9bd6aa;border-color:#435f4f}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center}.panel{background:#1b1c20;border:1px solid #393439;border-radius:10px;padding:24px;margin-top:18px}.field{width:100%;background:#141619;color:white;border:1px solid #534548;border-radius:6px;padding:14px;margin:8px 0 15px}textarea{min-height:110px;resize:vertical}.categories{display:flex;flex-wrap:wrap;gap:9px}.chip{background:#28272a;color:#ddd2c9;border:1px solid #50464a;padding:9px 13px;border-radius:5px}.chip.on{border-color:#c44950;background:#48272c;color:#fff}.choice{display:block;width:100%;text-align:left;background:#232428;color:#f3e9e3;border:1px solid #493d42;border-radius:7px;margin:10px 0;padding:15px}.choice:hover{border-color:#c44950;background:#31272c}.layout2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(260px,.7fr);gap:16px}.board{min-height:310px;border:1px solid #624c43;border-radius:8px;background:radial-gradient(circle at 50% 40%,#5b4331,#322821 90%);position:relative;overflow:hidden;padding:28px}.board:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#ffffff04 0 1px,transparent 1px 8px);pointer-events:none}.pins{position:relative;z-index:2;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.note{background:#e2d3b8;color:#292321;transform:rotate(-2deg);min-height:102px;padding:15px;box-shadow:2px 8px 9px #0006;animation:pin .5s both}.note:nth-child(even){transform:rotate(2deg)}.note b{display:block;font:700 12px Consolas;margin:7px 0}.note small{font-size:11px}.pin{position:absolute;left:48%;top:-8px;background:#c4353c;width:13px;height:13px;border-radius:50%;box-shadow:2px 2px 3px #0007}.thread{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;stroke:#ac3539;stroke-width:2;opacity:.78}.thread line{stroke-dasharray:220;stroke-dashoffset:220;animation:draw 1.2s .35s forwards}.timeline{display:grid;gap:12px}.timeline div{border-left:2px solid #b03b42;padding:2px 0 3px 14px;color:#dbd0c8;font-size:13px}.steps{padding-left:24px;color:#e6d9ce;line-height:1.8}.small{font-size:12px;color:#998e8b}.empty{text-align:center;padding:50px 15px;color:#a99d95}.intro{position:fixed;inset:0;background:#101115f5;z-index:20;display:grid;place-content:center;text-align:center;animation:fadein .4s}.intro.hidden{display:none}.intro .file{width:190px;height:120px;margin:0 auto 45px;position:relative;perspective:600px}.intro .file:before{content:"";position:absolute;left:0;top:-12px;width:83px;height:24px;background:#a77c50;border-radius:5px}.intro .file:after{content:"CASE #0001";position:absolute;inset:0;border-radius:8px;background:#bd9468;color:#55392b;display:grid;place-items:center;font:700 16px Consolas;transform-origin:bottom center;animation:openfolder 1.6s .3s both;box-shadow:0 14px 20px #0008}.intro h2{letter-spacing:.16em;animation:fadein 1.3s}.intro p{font:12px Consolas;color:#bca187}.intro .skip{background:none;color:#c6b5a7;border:0;margin-top:26px;text-decoration:underline}.closed-stamp{border:4px solid #bb4649;color:#de676b;font:bold 27px Consolas;display:inline-block;padding:9px;transform:rotate(-10deg);animation:stamp .5s both}.footer{margin-top:35px;font:11px Consolas,monospace;color:#6c6868}@keyframes openfolder{0%{transform:rotateX(0);filter:brightness(.65)}55%{transform:rotateX(-65deg)}100%{transform:rotateX(-120deg);filter:brightness(1.2)}}@keyframes stamp{0%{transform:scale(2.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(-10deg);opacity:1}}@keyframes draw{to{stroke-dashoffset:0}}@keyframes pin{from{opacity:0;transform:translateY(-14px) rotate(-2deg)}to{opacity:1}}@keyframes fadein{from{opacity:0}to{opacity:1}}@media(max-width:950px){.folder-art{opacity:.24;right:-20px}.layout2{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block}.side{padding:16px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.motto,.privacy{display:none}.main{padding:24px 16px}.cards{grid-template-columns:1fr}.hero{min-height:320px}.pins{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="shell"><aside class="side"><div class="brand"><svg viewBox="0 0 60 60"><path d="M4 10H25L31 16H54V45H4Z" fill="#c29968"/><path d="M4 20H55V47H4Z" fill="#ad8052"/><circle cx="27" cy="33" r="13" fill="#18191d" stroke="#bb4147" stroke-width="6"/><path d="M37 43L53 58" stroke="#bb4147" stroke-width="7" stroke-linecap="round"/></svg><span>CASE<br>CLOSED <small>AI</small></span></div><div class="motto">DON'T GUESS. INVESTIGATE.</div><nav class="nav" id="nav"></nav><div class="privacy"><b>●</b> Local prototype · no live AI</div></aside><main class="main" id="app"></main></div><div id="intro" class="intro hidden"><div class="file"></div><h2>OPENING CASE FILE</h2><p>IDENTIFY · INVESTIGATE · VERIFY</p><button class="skip" id="skip">Skip intro</button></div>
<script>
"use strict";
const app=document.querySelector("#app"),intro=document.querySelector("#intro"),nav=document.querySelector("#nav"),storeKey="ccai-cases-v1";
const cases=JSON.parse(localStorage.getItem(storeKey)||"[]");let route="home",category="Wi-Fi",report="",active=null,stage="question",findings=[],questionIndex=0,solution=null;
const scenarios={
"Wi-Fi":{q:[{text:"Do other devices also lose internet access?",options:["Yes, multiple devices","No, only this device","I'm not sure"]},{text:"Does the problem happen across different Wi-Fi networks?",options:["Yes, everywhere","Only on this network","I haven't tested"]}],steps:["Check whether other devices are affected.","Restart your router only if you have permission and doing so will not interrupt important work.","Forget and reconnect to the network on the affected device.","Check for updates using the device manufacturer's official support tools.","Test connectivity again before marking the case resolved."]},
"Computer":{q:[{text:"Which symptom is most noticeable?",options:["Slow performance","Unexpected restart","An app is freezing"]},{text:"Did this start after a change?",options:["After an update","After installing software","No clear change"]}],steps:["Save open work before troubleshooting.","Check available disk space and running applications.","Install trusted OS and application updates.","Restart once if safe, then reproduce the original problem."]},
"Phone":{q:[{text:"What is the main problem?",options:["Battery drains quickly","Apps keep closing","Connection trouble"]},{text:"Is your phone up to date?",options:["Yes","No","Not sure"]}],steps:["Check battery usage and storage in system settings.","Update the operating system and affected applications.","Restart and repeat the problem scenario.","Back up important data before considering reset options."]},
"Printer":{q:[{text:"What happens when you print?",options:["Printer offline","Paper jam","Job stuck in queue"]},{text:"How is the printer connected?",options:["USB","Wi-Fi","Ethernet"]}],steps:["Check printer power and error indicators.","Inspect the print queue and cancel only unwanted jobs.","Verify the printer is connected to the correct network or cable.","Print a test page and confirm the issue is resolved."]},
"Software":{q:[{text:"What does the software do?",options:["Crashes","Does not open","Displays an error"]},{text:"Is the issue limited to one app?",options:["Yes","Multiple apps","Not sure"]}],steps:["Record the exact error message without sharing passwords.","Check for supported application updates.","Try an ordinary restart and verify whether the issue repeats.","Consult the vendor's official troubleshooting documentation."]},
"Fiber":{q:[{text:"What is the fiber connection doing?",options:["No internet","Intermittent connection","Slow speeds"]},{text:"Are there warning lights on the ONT or router?",options:["Yes","No","I don't know"]}],steps:["Check router and optical network terminal status lights.","Check your provider's official outage status.","Avoid disconnecting fiber cables or opening optical equipment.","Contact the provider if an optical alarm persists."]}
};
function save(){localStorage.setItem(storeKey,JSON.stringify(cases))}
function html(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function navigate(r){route=r;render()}
function renderNav(){nav.innerHTML=[["home","⌂  Home"],["new","⌕  Open a case"],["cases","▱  Casebook"],["about","ⓘ  About"]].map(([r,t])=>'<button data-route="'+r+'" class="'+(r===route?'active':'')+'">'+t+'</button>').join("");nav.querySelectorAll("button").forEach(b=>b.onclick=()=>navigate(b.dataset.route))}
function render(){renderNav();if(route==="home"){app.innerHTML='<section class="hero"><div class="hero-copy"><span class="micro eyebrow">CASE CLOSED AI / INVESTIGATION DESK</span><h1>Don’t guess.<br>Investigate.</h1><p>A simple way to work through technology problems. Collect clues, follow safe steps, and close the case when the fix works.</p><div class="actions"><button class="btn" id="open">Open an investigation →</button><button class="btn secondary" id="casebook">View casebook</button></div></div><div class="folder-art"><div class="tab"></div><div class="body"></div><div class="stamp">CASE FILE</div></div></section><h3 class="section-head">YOUR INVESTIGATION PROCESS</h3><section class="cards"><article class="card"><span class="tag">01 / IDENTIFY</span><h3>Report the issue</h3><p>Tell the app what you are experiencing.</p></article><article class="card"><span class="tag">02 / INVESTIGATE</span><h3>Collect clues</h3><p>Answer a few focused questions.</p></article><article class="card"><span class="tag">03 / VERIFY</span><h3>Confirm the fix</h3><p>Try the suggested steps and record the outcome.</p></article></section><div class="footer">REVIEW PROTOTYPE · No live device scans or automatic repairs</div>';document.querySelector("#open").onclick=()=>navigate("new");document.querySelector("#casebook").onclick=()=>navigate("cases")}
else if(route==="new"){app.innerHTML='<span class="micro">NEW CASE / INTAKE</span><h1>What went wrong?</h1><p>Choose a category and describe your issue. We will investigate one clue at a time.</p><div class="panel"><h3>Problem category</h3><div class="categories" id="cats"></div><h3>Describe the problem</h3><textarea id="report" class="field" maxlength="1000" placeholder="Example: My Wi-Fi keeps disconnecting every few minutes."></textarea><button id="start" class="btn">Open case file →</button></div>';document.querySelector("#cats").innerHTML=Object.keys(scenarios).map(x=>'<button class="chip '+(x===category?'on':'')+'" data-category="'+x+'">'+x+'</button>').join("");document.querySelectorAll("[data-category]").forEach(b=>b.onclick=()=>{report=document.querySelector("#report").value;category=b.dataset.category;render();document.querySelector("#report").value=report});document.querySelector("#report").value=report;document.querySelector("#start").onclick=()=>{report=document.querySelector("#report").value.trim()||"Help troubleshoot my "+category+" issue";active={id:Date.now(),category,report,created:new Date().toLocaleString(),status:"Open",findings:[]};cases.unshift(active);save();stage="question";questionIndex=0;findings=[];intro.classList.remove("hidden");const timer=setTimeout(()=>{intro.classList.add("hidden");route="investigate";render()},2300);document.querySelector("#skip").onclick=()=>{clearTimeout(timer);intro.classList.add("hidden");route="investigate";render()}}}
else if(route==="investigate"){if(!active){navigate("cases");return}const sc=scenarios[active.category];const board='<div class="board"><svg class="thread" viewBox="0 0 500 300" preserveAspectRatio="none"><line x1="110" y1="86" x2="364" y2="90"/><line x1="125" y1="86" x2="350" y2="236"/></svg><div class="pins"><div class="note"><span class="pin"></span><b>CASE REPORT</b><small>'+html(active.report.slice(0,100))+'</small></div>'+findings.map((f,i)=>'<div class="note" style="animation-delay:'+i*.15+'s"><span class="pin"></span><b>CLUE 0'+(i+1)+'</b><small>'+html(f)+'</small></div>').join('')+'</div></div>';app.innerHTML='<div class="topline"><span class="micro">ACTIVE INVESTIGATION / #'+String(active.id).slice(-5)+'</span><span class="status">'+active.status+'</span></div><h1>'+html(active.category)+' investigation</h1><p>'+html(active.report)+'</p><div class="layout2"><div><h3 class="section-head">EVIDENCE BOARD</h3>'+board+'</div><section><h3 class="section-head">DETECTIVE\'S NOTEBOOK</h3><div class="panel" id="notebook"></div></section></div><div class="footer">Visual clues are user-reported evidence, not verified system measurements.</div>';const nb=document.querySelector("#notebook");if(stage==="question"){const q=sc.q[questionIndex];nb.innerHTML='<span class="tag">QUESTION '+(questionIndex+1)+' / '+sc.q.length+'</span><h2>'+html(q.text)+'</h2><p class="small">Pick the best answer to narrow the investigation.</p>'+q.options.map((o,i)=>'<button class="choice" data-answer="'+i+'">'+html(o)+'</button>').join('');nb.querySelectorAll("[data-answer]").forEach(b=>b.onclick=()=>{findings.push(q.text+" — "+q.options[Number(b.dataset.answer)]);active.findings=[...findings];save();questionIndex++;if(questionIndex>=sc.q.length)stage="solution";render()})}else if(stage==="solution"){nb.innerHTML='<span class="tag">ACTION PLAN / GUIDED DEMO</span><h2>Recommended checks</h2><p class="small">These are general, low-risk suggestions—not a confirmed diagnosis or automated repair.</p><ol class="steps">'+sc.steps.map(s=>'<li>'+html(s)+'</li>').join('')+'</ol><button class="btn" id="works">The issue is fixed</button><button class="choice" id="notyet">Still happening</button>';document.querySelector("#works").onclick=()=>{active.status="Resolved by user";save();stage="closed";render()};document.querySelector("#notyet").onclick=()=>{active.status="Still open";save();stage="open";render()}}else if(stage==="closed"){nb.innerHTML='<div class="closed-stamp">CASE CLOSED</div><h2>User confirmed resolution</h2><p>This case was closed by your confirmation; no independent re-test was performed.</p><button class="btn secondary" id="archive">View casebook</button>';document.querySelector("#archive").onclick=()=>navigate("cases")}else{nb.innerHTML='<span class="status">STILL OPEN</span><h2>Investigation continues</h2><p>Document the result, try a trusted support resource, or contact a qualified technician if the problem persists.</p><button class="btn secondary" id="archive">View casebook</button>';document.querySelector("#archive").onclick=()=>navigate("cases")}}
else if(route==="cases"){app.innerHTML='<span class="micro">ARCHIVE / LOCAL CASEBOOK</span><h1>Casebook</h1><p>Review your reports and recorded answers. Cases are saved in this browser profile only.</p>'+(cases.length?'<div class="cards">'+cases.map(c=>'<article class="card"><div class="topline"><span class="tag">#'+String(c.id).slice(-5)+'</span><span class="status '+(c.status.startsWith("Resolved")?"done":"")+'">'+html(c.status)+'</span></div><h3>'+html(c.category)+'</h3><p>'+html(c.report.slice(0,130))+'</p><p class="small">'+html(c.created)+'</p></article>').join('')+'</div>':'<div class="panel empty">No cases yet. Open an investigation to create one.</div>')+'<div class="actions"><button id="newcase" class="btn">Open a case</button><button id="clear" class="btn secondary">Delete local case history</button></div>';document.querySelector("#newcase").onclick=()=>navigate("new");document.querySelector("#clear").onclick=()=>{if(confirm("Permanently delete case history saved in this browser?")){cases.length=0;save();render()}}}
else if(route==="about"){app.innerHTML='<span class="micro">CASE CLOSED AI / ABOUT</span><h1>Find the cause. Fix the problem. Prove the result.</h1><div class="panel"><h2>What this review build does</h2><p>Provides animated desktop-style presentation, a guided rule-based investigation for six issue categories, a pinned evidence board, suggested troubleshooting checks, and a local casebook.</p><h2>What it does not do yet</h2><p>It does not scan your device, detect malware, use a live AI model, repair software automatically, or independently verify that a fix worked. All evidence comes from your answers.</p><h2>Privacy</h2><p>Case notes are stored in this browser's local storage without encryption. Do not enter passwords, secrets, or sensitive information.</p></div>'}}
render();
</script></body></html>
